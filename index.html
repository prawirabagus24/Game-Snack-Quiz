<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="bg-bubbles">
    <span></span><span></span><span></span><span></span><span></span><span></span>
  </div>

  <h1 class="wiggle-title">🐍 SNAKE QUIZ</h1>
  <div class="subtitle">Kendalikan ular untuk memakan jawaban yang BENAR! (IPA SD)</div>

  <div id="hud">
    <div class="hud-item">Skor<br><span id="score">0</span></div>
    <div class="hud-item">Nyawa<br><span id="lives">❤️❤️❤️</span></div>
    <div class="hud-item">Level<br><span id="level">1</span></div>
    <div class="hud-item">Combo<br><span id="combo">0</span></div>
    <div class="hud-item">Top Skor<br><span id="highscore">0</span></div>
  </div>

  <div id="question-box">
    <div id="question-text">Memuat soal...</div>
    <div id="options-legend"></div>
  </div>

  <div class="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div id="countdown"></div>
    <div id="levelup-banner">🎉 LEVEL UP! 🎉</div>
    <div id="praise-toast"></div>
  </div>

  <div id="controls-mobile">
    <button id="up">↑</button>
    <button id="left">←</button>
    <button id="down">↓</button>
    <button id="right">→</button>
  </div>

  <div id="overlay">
    <h2 id="overlay-title">Game Over</h2>
    <p id="overlay-text">Skor akhir kamu: 0</p>
    <p id="overlay-highscore"></p>
    <button id="restart-btn">Main Lagi</button>
  </div>

  <div id="start-overlay">
    <div class="start-card">
      <div class="start-icon">🐍</div>
      <h2>SNAKE QUIZ</h2>
      <p class="tagline">Arahkan ular ke jawaban yang benar!</p>
      <div class="start-features">
        <div class="feature-item"><span>🍗</span>Jawaban jadi makanan</div>
        <div class="feature-item"><span>❤️</span>3 nyawa</div>
        <div class="feature-item"><span>🔥</span>Combo & skor</div>
      </div>
      <button id="start-btn">▶ Mulai Main</button>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
